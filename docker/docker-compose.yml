# docker compose -f docker/docker-compose.yml up -d
services:
  open-toontown:
    image: ghcr.io/lpuffyy/open-toontown-anywhere:latest
    # build: { context: .., dockerfile: docker/Dockerfile }       # to build it here instead
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }     # the game's logs are also printed here, so keep them from piling up
    ports:
      - "7380:80"
    volumes:
      - ./resources:/ot/src/resources:ro       # the game's resources (not included): phase_3, phase_4, ...
      - ./databases:/ot/src/astron/databases
      - ./data:/ot/data
