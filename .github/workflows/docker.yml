name: Docker image

# Builds the server image and publishes it to the GitHub Container Registry as
#   ghcr.io/<owner>/open-toontown-anywhere
# The image has the game's code but none of the game's resources (they are not in this repository).

on:
  push:
    branches: [anywhere]
    tags: ['v*']
  pull_request:
    branches: [anywhere]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-toontown-anywhere
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=anywhere,enable=${{ github.ref == 'refs/heads/anywhere' }}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
